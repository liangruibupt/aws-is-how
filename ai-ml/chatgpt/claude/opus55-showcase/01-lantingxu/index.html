<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臨《蘭亭集序》· 神龍本逐筆臨寫</title>
<meta name="description" content="以唐馮承素摹本（神龍本）墨跡為範本，逐筆臨寫王羲之《蘭亭集序》全篇三百二十四字的網頁動畫。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='3' fill='%23c63d24'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23f4e8d2' font-family='serif'%3E%E8%87%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-tc-webfont@1.2.0/lxgwwenkaitc-regular.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-label="《蘭亭集序》臨寫動畫"></canvas>

<header class="masthead">
  <div class="tiqian">
    <span class="tq-title">蘭亭集序</span>
    <span class="tq-sub">神龍本</span>
    <i class="tq-seal">臨</i>
  </div>
  <div class="byline">
    <span>東晉　王羲之　撰并書</span>
    <span>唐　馮承素　摹</span>
  </div>
</header>

<section class="stats" aria-live="polite">
  <div><small>行</small><b id="stCol">一</b><em>／二十八</em></div>
  <div><small>字</small><b id="stChar">〇</b><em>／三百二十四</em></div>
  <div><small>之</small><b id="stZhi">〇</b><em>／二十</em></div>
</section>

<aside id="note" class="note" aria-live="polite"><span class="note-where"></span><p class="note-text"></p></aside>

<nav class="bar" aria-label="控制">
  <button id="play" class="play" title="行筆／停筆（空格）" aria-label="行筆"><i></i></button>
  <div class="bar-rows">
    <div class="bar-row">
      <div class="seg" id="speed" role="radiogroup" aria-label="速度">
        <button data-v="0.5">×½</button><button data-v="1">×1</button><button data-v="2">×2</button><button data-v="4">×4</button><button data-v="8">×8</button><button data-v="16">×16</button>
      </div>
      <span class="sep"></span>
      <div class="seg" id="view" role="radiogroup" aria-label="視角">
        <button data-v="auto" title="自動運鏡">運鏡</button><button data-v="near" title="近觀筆鋒">近觀</button><button data-v="col" title="整行">通行</button><button data-v="all" title="全卷（F）">全卷</button>
      </div>
    </div>
    <div class="bar-row">
      <label class="trace" title="透影：範本襯於紙下的濃淡"><span>透影</span><input id="trace" type="range" min="0" max="0.6" step="0.01" value="0.07"></label>
      <span class="sep"></span>
      <div class="tools">
        <button id="btnOrig" title="按住對照原帖（M）">對帖</button>
        <button id="btnZhi" title="二十個「之」同時臨寫">廿之</button>
        <button id="btnSound" title="筆聲" aria-pressed="false">筆聲</button>
        <button id="btnRestart" title="從頭再臨">重臨</button>
      </div>
    </div>
  </div>
</nav>

<section class="shiwen-wrap" aria-label="釋文">
  <header><span>釋文</span><small>點字即可移筆至該處</small></header>
  <div id="shiwen" class="shiwen"></div>
  <div class="progress"><i id="prog"></i></div>
</section>

<div id="finale" class="finale" hidden>
  <p class="f1">臨　畢</p>
  <p class="f2">三百二十四字　·　二十「之」各異</p>
  <div class="f-actions"><button data-act="zhi">觀廿之</button><button data-act="again">再臨一遍</button></div>
</div>

<div id="gallery" class="gallery" hidden role="dialog" aria-modal="true" aria-label="廿之">
  <div class="gallery-inner">
    <header>
      <h2>廿之</h2>
      <p>全篇二十個「之」字——同一人、同一日、同一篇，無一雷同。</p>
      <button class="close" aria-label="關閉">×</button>
    </header>
    <div id="zhiGrid" class="zhi-grid"></div>
  </div>
</div>

<div id="intro" class="intro">
  <div class="intro-inner">
    <h2 class="intro-title">蘭亭集序</h2>
    <p class="intro-verse">永和九年　歲在癸丑<br>暮春之初　會于會稽山陰之蘭亭</p>
    <div class="intro-body">
      <p>以唐 馮承素 摹本（神龍本）墨跡為範本：從掃描影像中逐字切分、提取骨架、推演筆順，再以一管毛筆逐筆臨寫全篇<b>三百二十四</b>字——連同「崇山」旁添、塗改墨團，與二十個各不相同的「之」。</p>
      <button id="start" class="start" disabled><i class="grind"></i><span id="startLabel">研墨</span></button>
      <p class="keys">空格 行筆／停筆　·　← → 移行　·　按住 M 對帖<br>拖曳平移　·　滾輪縮放　·　F 全卷</p>
    </div>
  </div>
</div>

<noscript><p class="noscript">此頁需啟用 JavaScript。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
